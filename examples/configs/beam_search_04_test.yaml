# Beam search strategy — tuned for MiniGPT-04 on the host GPU.
#
# Host GPU: NVIDIA A100-SXM4-40GB (MIG 2g.10gb slice)
# LLM:      DeepSeek (OpenAI-compatible gateway)

strategy: beam_search
num_workers: 4
max_rounds: 10

strategy_config:
  num_top_kernels: 2
  num_bottlenecks: 2

# Fuser generation models (used by --stage generate; CLI flags override these)
extract_model: deepseek-v4.1-flash
dispatch_model: deepseek-v4.1-flash
compose_model: deepseek-v4.1-flash
openai_model: deepseek-v4.1-flash


high_reasoning_effort: true      #gpt可用
allow_source_only_fallback: true

benchmark_warmup: 10
benchmark_repeat: 50
divergence_threshold: 50.0
target_platform: cuda
gpu_name: "NVIDIA A100 SXM4 40GB"